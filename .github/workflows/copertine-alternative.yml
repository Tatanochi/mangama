
name: Recupera copertine alternative

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python recupera_copertine_libri.py
      - name: Salva copertine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add copertine-alternative.json
          git diff --cached --quiet || (git commit -m "Aggiorna copertine alternative" && git push)
