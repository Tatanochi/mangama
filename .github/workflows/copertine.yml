
name: Aggiorna copertine MangaYo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python recupera_copertine_mangayo.py
      - name: Salva copertine trovate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add copertine-mangayo.json
          git diff --cached --quiet || git commit -m 'Aggiorna copertine MangaYo'
          git push
